<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Outline -->
  <path d="M50 5 L88 20 C88 56 68 84 50 95 C32 84 12 56 12 20 Z" 
        fill="#0b1120" 
        stroke="url(#shieldGrad)" 
        stroke-width="3.5" 
        stroke-linejoin="round"
        filter="url(#shieldGlow)" />

  <!-- Inner Protective Shield Layer -->
  <path d="M50 14 L80 26 C80 54 64 77 50 86 C36 77 20 54 20 26 Z" 
        fill="url(#glowGrad)" 
        stroke="#38bdf8" 
        stroke-width="1.2" 
        stroke-dasharray="3 2"
        stroke-linejoin="round" />

  <!-- Security Code Node Glyph (Bracket + Lock/Node) -->
  <!-- Left Code Bracket < -->
  <path d="M40 38 L31 48 L40 58" 
        stroke="url(#coreGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Right Code Bracket > -->
  <path d="M60 38 L69 48 L60 58" 
        stroke="url(#coreGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Defense Core / Shield Keyhole / Slash -->
  <path d="M54 35 L46 61" 
        stroke="#38bdf8" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- Top Guardrail Indicator Node -->
  <circle cx="50" cy="24" r="3" fill="#10b981" />
  <circle cx="50" cy="24" r="5" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
</svg>
