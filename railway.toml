# Railway: deploy the API from this Dockerfile.
# In the Railway dashboard: New Project -> Deploy from GitHub repo ->
# Settings -> set "Dockerfile Path" to "Dockerfile.deploy",
# then add a PostgreSQL plugin and the variables below.
{
  "$schema": "https://railway.app/railway.schema.json",
  "build": {
    "builder": "DOCKERFILE",
    "dockerfilePath": "Dockerfile.deploy"
  },
  "deploy": {
    "healthcheckPath": "/healthz",
    "healthcheckTimeout": 300,
    "restartPolicyType": "ON_FAILURE",
    "restartPolicyMaxRetries": 5
  }
}
